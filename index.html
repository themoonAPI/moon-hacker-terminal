<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon•API Hacker Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Moon Logo" class="logo">
        <h1>Moon•API Fake Hacker Terminal</h1>
    </header>

    <main>
        <div id="terminal">
            <p id="output"></p>
            <input id="command" placeholder="Type command (e.g., hack nasa)" onkeyup="if(event.key==='Enter') runCommand();">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
